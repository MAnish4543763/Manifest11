services:
  - type: web
    name: manifest-esports-api
    runtime: node
    plan: starter # Persistent disks require a paid Render service plan.
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_FILE
        value: /var/data/manifest-esports.sqlite
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: manifest-esports-data
      mountPath: /var/data
      sizeGB: 1
